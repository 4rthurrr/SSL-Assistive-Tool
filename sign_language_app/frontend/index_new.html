<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSL Sign Language Recognition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.1rem; opacity: 0.9; }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        .video-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }
        .overlay.hidden { display: none; }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #218838;
        }
        .results-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }
        .status {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffc107;
        }
        .status-dot.connected { background: #28a745; }
        .status-dot.error { background: #dc3545; }
        .prediction-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .prediction-main {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .confidence {
            font-size: 1.5rem;
            color: #28a745;
        }
        .top-predictions {
            margin-top: 20px;
        }
        .pred-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 5px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .loading.active { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }
        .error-message.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤟 SSL Sign Language Recognition</h1>
            <p class="subtitle">Real-time Sri Lankan Sign Language detection</p>
        </header>

        <div class="main-content">
            <!-- Video Section -->
            <div class="video-section">
                <div class="video-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                    <div id="overlay" class="overlay">
                        <span>Click "Start Camera" to begin</span>
                    </div>
                </div>

                <div class="controls">
                    <button id="startBtn" class="btn-primary">📷 Start Camera</button>
                    <button id="stopBtn" class="btn-secondary" disabled>⏹️ Stop</button>
                    <button id="recordBtn" class="btn-success" disabled>🎬 Record & Predict</button>
                </div>

                <div class="status">
                    <div class="status-item">
                        <span class="status-dot" id="serverDot"></span>
                        <span>Server: <span id="serverStatus">Checking...</span></span>
                    </div>
                    <div class="status-item">
                        <span class="status-dot" id="mediapipeDot"></span>
                        <span>MediaPipe: <span id="mediapipeStatus">Initializing...</span></span>
                    </div>
                    <div class="status-item">
                        <span class="status-dot" id="handDot"></span>
                        <span>Tracking: <span id="handStatus">Not detected</span></span>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <h2>Prediction Results</h2>
                
                <div class="error-message" id="errorMessage"></div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Analyzing sign...</p>
                </div>

                <div id="results" style="display: none;">
                    <div class="prediction-card">
                        <div class="prediction-main" id="mainPrediction">-</div>
                        <div class="confidence">Confidence: <span id="mainConfidence">-</span></div>
                    </div>

                    <div class="top-predictions">
                        <h3>Top 3 Predictions:</h3>
                        <div id="topPredictions"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MediaPipe CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <script>
        console.log('🚀 Fresh App Loading...');

        // Configuration
        const API_URL = window.location.origin;
        const SEQUENCE_LENGTH = 50;
        const FRAME_INTERVAL = 50; // 20 FPS (faster collection for Holistic)
        const RECORDING_DURATION = 5000; // 5 seconds max

        // State
        let camera = null;
        let holistic = null;
        let isCapturing = false;
        let isRecording = false;
        let collectedFrames = [];
        let mediapipeReady = false;

        // DOM Elements
        const elements = {
            webcam: document.getElementById('webcam'),
            canvas: document.getElementById('canvas'),
            overlay: document.getElementById('overlay'),
            startBtn: document.getElementById('startBtn'),
            stopBtn: document.getElementById('stopBtn'),
            recordBtn: document.getElementById('recordBtn'),
            serverDot: document.getElementById('serverDot'),
            serverStatus: document.getElementById('serverStatus'),
            mediapipeDot: document.getElementById('mediapipeDot'),
            mediapipeStatus: document.getElementById('mediapipeStatus'),
            handDot: document.getElementById('handDot'),
            handStatus: document.getElementById('handStatus'),
            loading: document.getElementById('loading'),
            errorMessage: document.getElementById('errorMessage'),
            results: document.getElementById('results'),
            mainPrediction: document.getElementById('mainPrediction'),
            mainConfidence: document.getElementById('mainConfidence'),
            topPredictions: document.getElementById('topPredictions')
        };

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('✅ DOM Ready');
            initializeApp();
        });

        async function initializeApp() {
            elements.startBtn.addEventListener('click', startCamera);
            elements.stopBtn.addEventListener('click', stopCamera);
            elements.recordBtn.addEventListener('click', startRecording);

            await initializeMediaPipe();
            checkServer();
            setInterval(checkServer, 5000);
        }

        async function initializeMediaPipe() {
            try {
                console.log('⏳ Initializing MediaPipe Holistic...');
                updateMediaPipeStatus('loading');

                holistic = new Holistic({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
                });

                holistic.setOptions({
                    modelComplexity: 0,  // FASTER: Use lite model (0 = fastest, 1 = balanced, 2 = accurate)
                    smoothLandmarks: false,  // FASTER: Disable smoothing for speed
                    enableSegmentation: false,  // Already disabled
                    smoothSegmentation: false,
                    refineFaceLandmarks: false,  // Already disabled
                    minDetectionConfidence: 0.3,  // FASTER: Lower threshold
                    minTrackingConfidence: 0.3   // FASTER: Lower threshold
                });

                holistic.onResults(onHolisticResults);

                mediapipeReady = true;
                updateMediaPipeStatus('ready');
                console.log('✅ MediaPipe Holistic Ready');
            } catch (error) {
                console.error('❌ MediaPipe Error:', error);
                updateMediaPipeStatus('error');
            }
        }

        async function checkServer() {
            try {
                const response = await fetch(`${API_URL}/`);
                const data = await response.json();
                if (data.status === 'running') {
                    updateServerStatus('connected');
                }
            } catch (error) {
                updateServerStatus('error');
            }
        }

        async function startCamera() {
            try {
                console.log('📷 Starting camera...');
                showOverlay('Starting camera...');

                if (!mediapipeReady) {
                    throw new Error('MediaPipe not ready');
                }

                camera = new Camera(elements.webcam, {
                    onFrame: async () => {
                        if (holistic && isCapturing) {
                            await holistic.send({ image: elements.webcam });
                        }
                    },
                    width: 480,  // FASTER: Reduced resolution (was 640)
                    height: 360  // FASTER: Reduced resolution (was 480)
                });

                await camera.start();
                isCapturing = true;
                hideOverlay();
                updateButtons();
                hideError();
                console.log('✅ Camera started');
            } catch (error) {
                console.error('❌ Camera error:', error);
                showError(error.message);
            }
        }

        function stopCamera() {
            if (camera) {
                camera.stop();
                camera = null;
            }
            isCapturing = false;
            isRecording = false;
            collectedFrames = [];
            showOverlay('Click "Start Camera" to begin');
            updateButtons();
            console.log('⏹️ Camera stopped');
        }

        function onHolisticResults(results) {
            const ctx = elements.canvas.getContext('2d');
            ctx.save();
            ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
            
            elements.canvas.width = results.image.width;
            elements.canvas.height = results.image.height;

            // Draw image first
            ctx.drawImage(results.image, 0, 0, elements.canvas.width, elements.canvas.height);

            // Draw all landmarks for visualization
            let hasLandmarks = false;
            
            // Draw face landmarks (if available)
            if (results.faceLandmarks) {
                drawConnectors(ctx, results.faceLandmarks, FACEMESH_TESSELATION, { color: '#C0C0C070', lineWidth: 1 });
                hasLandmarks = true;
            }
            
            // Draw pose landmarks
            if (results.poseLandmarks) {
                drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
                drawLandmarks(ctx, results.poseLandmarks, { color: '#FF0000', lineWidth: 2, radius: 4 });
                hasLandmarks = true;
            }
            
            // Draw hand landmarks
            if (results.leftHandLandmarks) {
                drawConnectors(ctx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#CC0000', lineWidth: 3 });
                drawLandmarks(ctx, results.leftHandLandmarks, { color: '#00FF00', lineWidth: 2, radius: 3 });
                hasLandmarks = true;
            }
            if (results.rightHandLandmarks) {
                drawConnectors(ctx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#0000CC', lineWidth: 3 });
                drawLandmarks(ctx, results.rightHandLandmarks, { color: '#FF0000', lineWidth: 2, radius: 3 });
                hasLandmarks = true;
            }
            
            // Update status
            if (hasLandmarks) {
                const parts = [];
                if (results.poseLandmarks) parts.push('pose');
                if (results.leftHandLandmarks) parts.push('left hand');
                if (results.rightHandLandmarks) parts.push('right hand');
                if (results.faceLandmarks) parts.push('face');
                updateHandStatus(`detected (${parts.join(', ')})`);
            } else {
                updateHandStatus('not-detected');
            }

            // Collect frames during recording
            if (isRecording && results.poseLandmarks) {
                // TRAINING DATA: 33 pose landmarks × 4 values = 132 features
                // MediaPipe Holistic provides exactly 33 pose landmarks!
                
                const frameFeatures = [];
                
                // CRITICAL: Use RAW MediaPipe coordinates (NO normalization!)
                // Training CSV files contain raw MediaPipe values directly
                // X/Y are image-relative (0.0-1.0, can exceed for off-frame landmarks)
                // Z is depth relative to hips (negative values)
                // Visibility is 0.0-1.0 confidence
                
                // Extract all 33 pose landmarks with RAW values
                for (let i = 0; i < 33; i++) {
                    if (results.poseLandmarks[i]) {
                        // Use raw MediaPipe coordinates exactly as training data
                        const x = results.poseLandmarks[i].x;
                        const y = results.poseLandmarks[i].y;
                        const z = results.poseLandmarks[i].z || 0;
                        const visibility = results.poseLandmarks[i].visibility !== undefined 
                            ? results.poseLandmarks[i].visibility 
                            : 1.0;
                        
                        frameFeatures.push(x, y, z, visibility);
                        
                        // Debug first frame's first landmark
                        if (collectedFrames.length === 0 && i === 0) {
                            console.log(`🎯 RAW COORDINATES CHECK - Nose (landmark 0):`);
                            console.log(`   x=${x.toFixed(6)}, y=${y.toFixed(6)}, z=${z.toFixed(6)}, vis=${visibility.toFixed(6)}`);
                            console.log(`   ✅ CORRECT: x should be 0.4-0.5 (NOT negative, NOT >1)`);
                            console.log(`   ✅ CORRECT: y should be 0.3-0.4`);
                            console.log(`   ✅ CORRECT: z should be -0.4 to -1.4 (negative)`);
                        }
                        
                        // Debug hip landmarks
                        if (collectedFrames.length === 0 && (i === 23 || i === 24)) {
                            const side = i === 23 ? 'LEFT' : 'RIGHT';
                            console.log(`   Hip ${side} (landmark ${i}): x=${x.toFixed(3)}, y=${y.toFixed(3)}, z=${z.toFixed(3)}`);
                        }
                    } else {
                        // Pad missing landmarks with zeros
                        frameFeatures.push(0, 0, 0, 0);
                    }
                }
                
                // Now we have exactly 132 features (33 landmarks × 4 values) - perfect match!
                collectedFrames.push(frameFeatures);
                
                // Debug log on first frame
                if (collectedFrames.length === 1) {
                    console.log('📊 First frame captured:');
                    console.log('   Total features:', frameFeatures.length);
                    console.log('   Format: 33 pose landmarks × 4 values (RAW MediaPipe coords)');
                    console.log('   Sample (first 12 - nose x,y,z,vis + left-eye-inner x,y,z,vis):', frameFeatures.slice(0, 12).map(v => v.toFixed(3)));
                }
            }
            
            ctx.restore();
        }

        function updateHandStatus(status) {
            if (status === 'detected') {
                elements.handDot.className = 'status-dot connected';
                elements.handStatus.textContent = 'Detected ✓';
            } else {
                elements.handDot.className = 'status-dot';
                elements.handStatus.textContent = 'Not detected';
            }
        }

        async function startRecording() {
            if (!isCapturing || isRecording) return;

            isRecording = true;
            collectedFrames = [];
            elements.recordBtn.disabled = true;
            console.log('🎬 Recording started...');

            setTimeout(async () => {
                isRecording = false;
                elements.recordBtn.disabled = false;
                console.log(`✅ Collected ${collectedFrames.length} frames`);
                
                // Debug: Show sample of collected data
                if (collectedFrames.length > 0) {
                    console.log('📊 Sample frame (first):', collectedFrames[0].slice(0, 8));
                    console.log('   Features per frame:', collectedFrames[0].length);
                }

                if (collectedFrames.length >= SEQUENCE_LENGTH) {
                    await sendPrediction(collectedFrames.slice(0, SEQUENCE_LENGTH));
                } else if (collectedFrames.length >= 20) {
                    // INTERPOLATE: If we have at least 20 frames, interpolate to 50
                    console.log('⚠️ Interpolating frames...');
                    const interpolated = interpolateFrames(collectedFrames, SEQUENCE_LENGTH);
                    await sendPrediction(interpolated);
                } else {
                    showError(`Only collected ${collectedFrames.length} frames. Need at least 20 (got ${collectedFrames.length}).`);
                }
            }, RECORDING_DURATION);
        }

        function interpolateFrames(frames, targetLength) {
            // Simple linear interpolation to reach target length
            const result = [];
            const ratio = (frames.length - 1) / (targetLength - 1);
            
            for (let i = 0; i < targetLength; i++) {
                const pos = i * ratio;
                const idx1 = Math.floor(pos);
                const idx2 = Math.min(idx1 + 1, frames.length - 1);
                const t = pos - idx1;
                
                // Interpolate between frames
                const frame1 = frames[idx1];
                const frame2 = frames[idx2];
                const interpolated = frame1.map((val, j) => 
                    val * (1 - t) + frame2[j] * t
                );
                
                result.push(interpolated);
            }
            
            console.log(`📈 Interpolated ${frames.length} → ${result.length} frames`);
            return result;
        }

        async function sendPrediction(frames) {
            try {
                console.log('📤 Sending prediction...');
                elements.loading.classList.add('active');
                elements.results.style.display = 'none';

                const payload = {
                    sequence: frames.map(frame => ({
                        landmarks: frame  // Send as flat array: [wrist_x, wrist_y, index_x, index_y]
                    }))
                };

                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error:', errorData);
                    throw new Error('Prediction failed: ' + JSON.stringify(errorData));
                }

                const result = await response.json();
                displayResults(result);
                console.log('✅ Prediction received:', result);
            } catch (error) {
                console.error('❌ Prediction error:', error);
                showError('Failed to get prediction: ' + error.message);
            } finally {
                elements.loading.classList.remove('active');
            }
        }

        function displayResults(result) {
            const confidencePct = result.confidence;
            
            // Color-code based on confidence
            let confidenceColor = '#2ecc71'; // Green for high
            let confidenceWarning = '';
            
            if (confidencePct >= 70) {
                confidenceColor = '#2ecc71'; // Green
                confidenceWarning = ' ✅';
            } else if (confidencePct >= 50) {
                confidenceColor = '#f39c12'; // Orange
                confidenceWarning = ' ⚠️';
            } else {
                confidenceColor = '#e74c3c'; // Red
                confidenceWarning = ' ❌ Low confidence - may be wrong!';
            }
            
            elements.mainPrediction.textContent = result.prediction;
            elements.mainConfidence.textContent = confidencePct.toFixed(1) + '%' + confidenceWarning;
            elements.mainConfidence.style.color = confidenceColor;

            // Log confidence assessment
            console.log(`🎯 Prediction: ${result.prediction} (${confidencePct.toFixed(1)}%)`);
            if (confidencePct < 50) {
                console.warn(`⚠️ LOW CONFIDENCE! This prediction may be inaccurate.`);
                console.warn(`   Model is uncertain - consider these alternatives:`);
                result.top_3.forEach((pred, i) => {
                    console.warn(`   ${i + 1}. ${pred.sign} (${pred.confidence.toFixed(1)}%)`);
                });
            }

            elements.topPredictions.innerHTML = result.top_3.map((pred, i) => `
                <div class="pred-item">
                    <span>${i + 1}. ${pred.sign}</span>
                    <span>${pred.confidence.toFixed(1)}%</span>
                </div>
            `).join('');

            elements.results.style.display = 'block';
        }

        function updateButtons() {
            elements.startBtn.disabled = isCapturing;
            elements.stopBtn.disabled = !isCapturing;
            elements.recordBtn.disabled = !isCapturing || isRecording;
        }

        function showOverlay(text) {
            elements.overlay.textContent = text;
            elements.overlay.classList.remove('hidden');
        }

        function hideOverlay() {
            elements.overlay.classList.add('hidden');
        }

        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.classList.add('active');
        }

        function hideError() {
            elements.errorMessage.classList.remove('active');
        }

        function updateServerStatus(status) {
            elements.serverDot.className = 'status-dot ' + status;
            elements.serverStatus.textContent = status === 'connected' ? 'Connected' : 'Disconnected';
        }

        function updateMediaPipeStatus(status) {
            elements.mediapipeDot.className = 'status-dot ' + (status === 'ready' ? 'connected' : status === 'error' ? 'error' : '');
            elements.mediapipeStatus.textContent = status === 'ready' ? 'Ready' : status === 'error' ? 'Error' : 'Loading...';
        }

        console.log('✅ App Initialized');
    </script>
</body>
</html>
